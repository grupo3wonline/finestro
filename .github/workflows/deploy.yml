name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar dependências
        run: composer install \
          --no-dev \
          --prefer-dist \
          --optimize-autoloader \
          --no-interaction

      - name: Executando migrations...
        run: php artisan migrate --force

      - name: Limpando caches...
        run: php artisan optimize:clear

      - name: Gerando caches...
        run: php artisan optimize

      - name: Limpar arquivos desnecessários
        run: |
          rm -rf .git
          rm -rf tests
          rm -rf node_modules

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ~/finestro
