name: 🚀 Deploy website to FTP Server Hostgator

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: finestro/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .editorconfig
            .styleci.yml
            tests/**
            phpunit.xml
