name: Deploy Laravel
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
name: 🚀 Deploy website to FTP Server Hostigator
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: finestro/
